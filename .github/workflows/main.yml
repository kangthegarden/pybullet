name: Build PyBullet Wheel
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build Wheel
        run: |
          python -m pip install --upgrade pip wheel
          pip wheel pybullet==3.2.6 --no-deps -w ./dist
      - name: Upload Wheel
        uses: actions/upload-artifact@v4
        with:
          name: pybullet-win64-cp310
          path: ./dist/*.whl
